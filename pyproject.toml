[project]
name = "computequote"
version = "0.1.0a0"
description = "Open cost modeling for AI training and inference"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.27",
  "playwright>=1.47",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["engine", "api", "tests", "scripts"]
